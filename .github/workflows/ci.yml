name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        env:
          PYTHONUTF8: "1"
        run: python checks/lint.py
      - name: Tests
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python tests/run_tests.py
